global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "devpulse-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "devpulse-fastapi"

  - job_name: "cadvisor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: "cadvisor"

  - job_name: "node-exporter"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"
