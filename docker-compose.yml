services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: devpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpulse_password}
      POSTGRES_DB: ${POSTGRES_DB:-devpulse_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devpulse} -d ${POSTGRES_DB:-devpulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - devpulse_net

  # 2. FastAPI Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devpulse-app:local
    container_name: devpulse_app
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-devpulse}:${POSTGRES_PASSWORD:-devpulse_password}@postgres:5432/${POSTGRES_DB:-devpulse_db}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devpulse_net
    expose:
      - "8000"

  # 3. Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: devpulse_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - devpulse_net

  # 4. Prometheus (Track B Observability)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: devpulse_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - devpulse_net

  # 5. Grafana Dashboard (Track B Observability)
  grafana:
    image: grafana/grafana:10.4.1
    container_name: devpulse_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-devpulse_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - devpulse_net

  # 6. cAdvisor (Container Metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: devpulse_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - devpulse_net

  # 7. node_exporter (Host System Metrics)
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: devpulse_node_exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - devpulse_net

networks:
  devpulse_net:
    driver: bridge
    name: devpulse_net

volumes:
  postgres_data:
    name: devpulse_postgres_data
  prometheus_data:
    name: devpulse_prometheus_data
  grafana_data:
    name: devpulse_grafana_data
