<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes dash-move {
        to { stroke-dashoffset: -40; }
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }

      .flow-line {
        stroke-dasharray: 6, 6;
        animation: dash-move 1.5s linear infinite;
      }

      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        fill: #f8fafc;
      }

      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        fill: #94a3b8;
      }

      .badge-tag {
        font-family: monospace;
        font-size: 10px;
        font-weight: bold;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="480" rx="16" fill="url(#flow-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Section Boundaries -->
  <!-- EC2 Cloud Boundary Box -->
  <rect x="230" y="30" width="660" height="420" rx="14" fill="#091026" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.8"/>
  <text x="250" y="55" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="700">☁️ AWS EC2 t3.micro (Ubuntu 24.04 / ap-south-1)</text>

  <!-- Docker Network Boundary Box -->
  <rect x="250" y="80" width="620" height="350" rx="10" fill="#0d1b38" stroke="#1d4ed8" stroke-width="1" opacity="0.6"/>
  <text x="270" y="105" fill="#93c5fd" font-family="monospace" font-size="11">🐳 Docker Compose Network [devpulse_net]</text>

  <!-- 1. Internet / User Node -->
  <g transform="translate(30, 180)">
    <rect width="150" height="75" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2" filter="url(#neon-glow)"/>
    <text x="75" y="32" text-anchor="middle" class="node-text" font-size="14">🌐 Internet User</text>
    <text x="75" y="50" text-anchor="middle" class="sub-text">Browser / Mobile (4G/5G)</text>
    <rect x="35" y="58" width="80" height="18" rx="4" fill="#0284c7" />
    <text x="75" y="70" text-anchor="middle" fill="#ffffff" class="badge-tag">PORT 80 (HTTP)</text>
  </g>

  <!-- Animated Line: User -> Nginx -->
  <path d="M 180 217 L 290 217" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-line"/>

  <!-- 2. Nginx Reverse Proxy Node -->
  <g transform="translate(290, 170)">
    <rect width="140" height="95" rx="10" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.8"/>
    <text x="70" y="32" text-anchor="middle" class="node-text" font-size="13">🛡️ Nginx</text>
    <text x="70" y="50" text-anchor="middle" class="sub-text">Reverse Proxy</text>
    <rect x="20" y="65" width="100" height="18" rx="4" fill="#065f46"/>
    <text x="70" y="77" text-anchor="middle" fill="#6ee7b7" class="badge-tag">80:80 -> app:8000</text>
  </g>

  <!-- Animated Line: Nginx -> FastAPI -->
  <path d="M 430 217 L 500 217" fill="none" stroke="#10b981" stroke-width="2" class="flow-line"/>

  <!-- 3. FastAPI Core Application Node -->
  <g transform="translate(500, 160)">
    <rect width="150" height="115" rx="10" fill="url(#card-grad)" stroke="#818cf8" stroke-width="2" filter="url(#neon-glow)"/>
    <text x="75" y="30" text-anchor="middle" class="node-text" font-size="14">⚡ FastAPI App</text>
    <text x="75" y="48" text-anchor="middle" class="sub-text">Non-root: appuser</text>
    <text x="75" y="64" text-anchor="middle" class="sub-text">Image Size: &lt;250MB</text>
    <rect x="25" y="80" width="100" height="20" rx="4" fill="#312e81"/>
    <text x="75" y="94" text-anchor="middle" fill="#c7d2fe" class="badge-tag">/metrics &amp; /healthz</text>
  </g>

  <!-- Animated Line: FastAPI -> PostgreSQL -->
  <path d="M 650 217 L 720 217" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line"/>

  <!-- 4. PostgreSQL Database Node -->
  <g transform="translate(720, 160)">
    <rect width="135" height="115" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="67" y="30" text-anchor="middle" class="node-text" font-size="13">🐘 PostgreSQL 16</text>
    <text x="67" y="48" text-anchor="middle" class="sub-text">pg_isready Health</text>
    <rect x="15" y="65" width="105" height="36" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="0.8"/>
    <text x="67" y="79" text-anchor="middle" fill="#93c5fd" class="badge-tag">NAMED VOLUME:</text>
    <text x="67" y="93" text-anchor="middle" fill="#bfdbfe" font-size="9" font-family="monospace">postgres_data</text>
  </g>

  <!-- ================= Observability Track B Section ================= -->
  <!-- Line from FastAPI to Prometheus (/metrics scrape) -->
  <path d="M 575 275 L 575 340 L 460 340" fill="none" stroke="#f59e0b" stroke-width="2" class="flow-line"/>

  <!-- 5. Prometheus Node -->
  <g transform="translate(320, 310)">
    <rect width="140" height="90" rx="10" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="70" y="28" text-anchor="middle" class="node-text" font-size="13">🔥 Prometheus</text>
    <text x="70" y="45" text-anchor="middle" class="sub-text">Scrapes every 10s</text>
    <rect x="25" y="58" width="90" height="20" rx="4" fill="#78350f"/>
    <text x="70" y="72" text-anchor="middle" fill="#fde68a" class="badge-tag">PORT 9090</text>
  </g>

  <!-- Line: Prometheus -> Grafana -->
  <path d="M 460 365 L 520 365" fill="none" stroke="#f59e0b" stroke-width="2" class="flow-line"/>

  <!-- 6. Grafana Dashboard Node -->
  <g transform="translate(520, 310)">
    <rect width="140" height="90" rx="10" fill="url(#card-grad)" stroke="#ea580c" stroke-width="1.8" filter="url(#neon-glow)"/>
    <text x="70" y="28" text-anchor="middle" class="node-text" font-size="13">📊 Grafana</text>
    <text x="70" y="45" text-anchor="middle" class="sub-text">4 Track B Panels</text>
    <rect x="25" y="58" width="90" height="20" rx="4" fill="#7c2d12"/>
    <text x="70" y="72" text-anchor="middle" fill="#fdba74" class="badge-tag">PORT 3000</text>
  </g>

  <!-- 7. cAdvisor & node_exporter Node -->
  <g transform="translate(700, 320)">
    <rect width="150" height="80" rx="10" fill="url(#card-grad)" stroke="#64748b" stroke-width="1.5"/>
    <text x="75" y="28" text-anchor="middle" class="node-text" font-size="12">📈 cAdvisor &amp; Node</text>
    <text x="75" y="46" text-anchor="middle" class="sub-text">Container CPU / Host OS</text>
    <text x="75" y="65" text-anchor="middle" fill="#94a3b8" class="badge-tag">PORTS 8080 / 9100</text>
  </g>

  <!-- Line: Exporters -> Prometheus -->
  <path d="M 700 365 L 660 365" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>
