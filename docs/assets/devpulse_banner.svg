<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a122c" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Neon Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.2" />
    </linearGradient>

    <!-- Dynamic Border Beam Gradients -->
    <linearGradient id="top-beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bot-beam-grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0" />
      <stop offset="50%" stop-color="#4ade80" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="border-beam-glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.25"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="30" cy="0" r="1.2" fill="#38bdf8" opacity="0.4" />
    </pattern>

    <style>
      @keyframes pulse-line {
        0% { stroke-dashoffset: 1200; opacity: 0.6; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
        100% { stroke-dashoffset: 0; opacity: 0.6; }
      }

      @keyframes ping-dot {
        0% { r: 4; opacity: 1; }
        70% { r: 14; opacity: 0; }
        100% { r: 4; opacity: 0; }
      }

      @keyframes float-box {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }

      @keyframes top-sweep {
        0% { transform: translateX(-300px); }
        100% { transform: translateX(900px); }
      }

      @keyframes bot-sweep {
        0% { transform: translateX(900px); }
        100% { transform: translateX(-300px); }
      }

      @keyframes corner-pulse {
        0%, 100% { opacity: 0.7; stroke: #38bdf8; }
        50% { opacity: 1; stroke: #4ade80; filter: drop-shadow(0 0 4px #4ade80); }
      }

      .pulse-anim {
        stroke-dasharray: 200, 400;
        animation: pulse-line 5s linear infinite;
      }

      .ping-circle {
        animation: ping-dot 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      .floating-cube {
        animation: float-box 6s ease-in-out infinite;
        transform-origin: 780px 140px;
      }

      .top-beam-anim {
        animation: top-sweep 3s ease-in-out infinite;
      }

      .bot-beam-anim {
        animation: bot-sweep 3s ease-in-out infinite;
      }

      .corner-bracket {
        animation: corner-pulse 3s ease-in-out infinite;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        font-weight: 600;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <!-- Background Base Container with Rounded Corners -->
  <rect width="900" height="280" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="900" height="280" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="160" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="750" cy="180" r="140" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>

  <!-- ================= DYNAMIC UPPER BORDER WITH ANIMATION ================= -->
  <!-- Base Top Rail -->
  <line x1="16" y1="2" x2="884" y2="2" stroke="#1e293b" stroke-width="2" />
  <!-- Glowing Running Top Beam -->
  <g class="top-beam-anim">
    <line x1="0" y1="2" x2="280" y2="2" stroke="url(#top-beam-grad)" stroke-width="3" filter="url(#border-beam-glow)" />
    <circle cx="280" cy="2" r="3" fill="#ffffff" filter="url(#border-beam-glow)" />
  </g>

  <!-- ================= DYNAMIC LOWER BORDER WITH ANIMATION ================= -->
  <!-- Base Bottom Rail -->
  <line x1="16" y1="278" x2="884" y2="278" stroke="#1e293b" stroke-width="2" />
  <!-- Glowing Running Bottom Beam (Opposite Direction) -->
  <g class="bot-beam-anim">
    <line x1="0" y1="278" x2="280" y2="278" stroke="url(#bot-beam-grad)" stroke-width="3" filter="url(#border-beam-glow)" />
    <circle cx="0" cy="278" r="3" fill="#ffffff" filter="url(#border-beam-glow)" />
  </g>

  <!-- Cybernetic Corner Brackets -->
  <g class="corner-bracket">
    <!-- Top-Left -->
    <path d="M 6 24 L 6 6 L 24 6" fill="none" stroke-width="2" stroke-linecap="round"/>
    <circle cx="6" cy="6" r="2" fill="#38bdf8" />
    <!-- Top-Right -->
    <path d="M 894 24 L 894 6 L 876 6" fill="none" stroke-width="2" stroke-linecap="round"/>
    <circle cx="894" cy="6" r="2" fill="#818cf8" />
    <!-- Bottom-Left -->
    <path d="M 6 256 L 6 274 L 24 274" fill="none" stroke-width="2" stroke-linecap="round"/>
    <circle cx="6" cy="274" r="2" fill="#38bdf8" />
    <!-- Bottom-Right -->
    <path d="M 894 256 L 894 274 L 876 274" fill="none" stroke-width="2" stroke-linecap="round"/>
    <circle cx="894" cy="274" r="2" fill="#4ade80" />
  </g>

  <!-- Animated Pulse / ECG Wave Across Center -->
  <path d="M 0,190 L 140,190 L 160,190 L 180,140 L 200,230 L 220,100 L 240,210 L 260,180 L 280,190 L 450,190 L 470,165 L 490,215 L 510,130 L 530,220 L 550,190 L 900,190" 
        fill="none" 
        stroke="#1e293b" 
        stroke-width="2.5" />

  <path d="M 0,190 L 140,190 L 160,190 L 180,140 L 200,230 L 220,100 L 240,210 L 260,180 L 280,190 L 450,190 L 470,165 L 490,215 L 510,130 L 530,220 L 550,190 L 900,190" 
        fill="none" 
        stroke="url(#pulse-grad)" 
        stroke-width="3" 
        stroke-linecap="round"
        stroke-linejoin="round"
        class="pulse-anim" 
        filter="url(#glow)" />

  <!-- Logo and Branding -->
  <g transform="translate(60, 65)">
    <!-- Status Indicator Pill -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="5" fill="#22c55e" />
      <circle cx="16" cy="14" r="5" fill="#22c55e" class="ping-circle" opacity="0.6"/>
      <text x="32" y="19" fill="#4ade80" font-size="11.5" class="badge-text">STATUS: ALL SYSTEMS NOMINAL</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#title-grad)" font-size="52" class="title-text" filter="url(#shadow)">DevPulse</text>

    <!-- Subtitle -->
    <text x="2" y="108" fill="#e2e8f0" font-size="16" class="title-text" font-weight="500">
      Cloud Incident &amp; Infrastructure Observability Stack
    </text>

    <!-- Track & Metadata Tags -->
    <g transform="translate(0, 130)">
      <!-- Track Badge -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="12" y="17" fill="#a5b4fc" font-size="11" class="badge-text">TRACK B: WATCH IT</text>

      <!-- Tech Badges -->
      <rect x="140" y="0" width="105" height="26" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
      <text x="150" y="17" fill="#7dd3fc" font-size="11" class="badge-text">AWS EC2 • KVM</text>

      <rect x="255" y="0" width="165" height="26" rx="6" fill="#14532d" stroke="#16a34a" stroke-width="1"/>
      <text x="265" y="17" fill="#86efac" font-size="11" class="badge-text">PROMETHEUS + GRAFANA</text>
    </g>
  </g>

  <!-- 3D Floating Isometric Cloud/Server Graphic on the Right -->
  <g class="floating-cube">
    <!-- Isometric Base Platform -->
    <g transform="translate(740, 130)">
      <!-- Server Box 1 (Bottom) -->
      <g transform="translate(0, 40)">
        <polygon points="0,-25 50,0 0,25 -50,0" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <polygon points="-50,0 0,25 0,55 -50,30" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
        <polygon points="0,25 50,0 50,30 0,55" fill="#0b1329" stroke="#0284c7" stroke-width="1"/>
        <circle cx="-25" cy="18" r="2" fill="#22c55e" filter="url(#glow)"/>
        <circle cx="-15" cy="23" r="2" fill="#38bdf8" filter="url(#glow)"/>
        <circle cx="-5" cy="28" r="2" fill="#38bdf8"/>
      </g>

      <!-- Server Box 2 (Middle) -->
      <g transform="translate(0, 0)">
        <polygon points="0,-25 50,0 0,25 -50,0" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
        <polygon points="-50,0 0,25 0,55 -50,30" fill="#0f172a" stroke="#4f46e5" stroke-width="1"/>
        <polygon points="0,25 50,0 50,30 0,55" fill="#0b1329" stroke="#4f46e5" stroke-width="1"/>
        <circle cx="-25" cy="18" r="2" fill="#22c55e" filter="url(#glow)"/>
        <circle cx="-15" cy="23" r="2" fill="#818cf8" filter="url(#glow)"/>
        <circle cx="-5" cy="28" r="2" fill="#818cf8"/>
      </g>

      <!-- Server Box 3 (Top / Golden Core) -->
      <g transform="translate(0, -40)">
        <polygon points="0,-25 50,0 0,25 -50,0" fill="#38bdf8" opacity="0.9"/>
        <polygon points="-50,0 0,25 0,55 -50,30" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8"/>
        <polygon points="0,25 50,0 50,30 0,55" fill="#0369a1" stroke="#38bdf8" stroke-width="0.8"/>
        <circle cx="-25" cy="18" r="2.5" fill="#ffffff" filter="url(#glow)"/>
        <circle cx="-15" cy="23" r="2.5" fill="#4ade80" filter="url(#glow)"/>
      </g>
    </g>
  </g>
</svg>
