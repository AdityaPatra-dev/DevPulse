<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 65" width="100%" height="65">
  <defs>
    <filter id="badge-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <style>
      .badge-bg { rx: 7px; stroke-width: 1px; }
      .b-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .b-icon { font-size: 13px; }
    </style>
  </defs>

  <!-- CI/CD GitHub Actions -->
  <g transform="translate(10, 14)" filter="url(#badge-glow)">
    <rect width="96" height="36" class="badge-bg" fill="#2088ff" stroke="#60a5fa"/>
    <text x="10" y="23" class="b-icon">🚀</text>
    <text x="28" y="23" class="b-text">CI Actions</text>
  </g>

  <!-- FastAPI -->
  <g transform="translate(114, 14)" filter="url(#badge-glow)">
    <rect width="84" height="36" class="badge-bg" fill="#009688" stroke="#26a69a"/>
    <text x="10" y="23" class="b-icon">⚡</text>
    <text x="28" y="23" class="b-text">FastAPI</text>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(206, 14)" filter="url(#badge-glow)">
    <rect width="98" height="36" class="badge-bg" fill="#336791" stroke="#4a8ac2"/>
    <text x="10" y="23" class="b-icon">🐘</text>
    <text x="28" y="23" class="b-text">Postgres</text>
  </g>

  <!-- Nginx -->
  <g transform="translate(312, 14)" filter="url(#badge-glow)">
    <rect width="78" height="36" class="badge-bg" fill="#009639" stroke="#1db954"/>
    <text x="10" y="23" class="b-icon">🛡️</text>
    <text x="28" y="23" class="b-text">Nginx</text>
  </g>

  <!-- Docker -->
  <g transform="translate(398, 14)" filter="url(#badge-glow)">
    <rect width="82" height="36" class="badge-bg" fill="#1d63ed" stroke="#3b82f6"/>
    <text x="10" y="23" class="b-icon">🐳</text>
    <text x="28" y="23" class="b-text">Docker</text>
  </g>

  <!-- Prometheus -->
  <g transform="translate(488, 14)" filter="url(#badge-glow)">
    <rect width="108" height="36" class="badge-bg" fill="#e6522c" stroke="#f97316"/>
    <text x="10" y="23" class="b-icon">🔥</text>
    <text x="28" y="23" class="b-text">Prometheus</text>
  </g>

  <!-- Grafana -->
  <g transform="translate(604, 14)" filter="url(#badge-glow)">
    <rect width="86" height="36" class="badge-bg" fill="#f46800" stroke="#fb923c"/>
    <text x="10" y="23" class="b-icon">📊</text>
    <text x="28" y="23" class="b-text">Grafana</text>
  </g>

  <!-- AWS EC2 -->
  <g transform="translate(698, 14)" filter="url(#badge-glow)">
    <rect width="92" height="36" class="badge-bg" fill="#ff9900" stroke="#fcd34d"/>
    <text x="10" y="23" class="b-icon">☁️</text>
    <text x="28" y="23" class="b-text" fill="#111827">AWS EC2</text>
  </g>

  <!-- KVM Virt-Manager -->
  <g transform="translate(798, 14)" filter="url(#badge-glow)">
    <rect width="92" height="36" class="badge-bg" fill="#6366f1" stroke="#818cf8"/>
    <text x="10" y="23" class="b-icon">🖥️</text>
    <text x="28" y="23" class="b-text">KVM/virsh</text>
  </g>
</svg>
