<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 28" width="220" height="28">
  <defs>
    <linearGradient id="cicd-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="58%" stop-color="#1e293b" />
      <stop offset="58%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <filter id="pill-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes ping-badge {
        0% { r: 3.5; opacity: 1; }
        70% { r: 8; opacity: 0; }
        100% { r: 3.5; opacity: 0; }
      }
      .badge-dot {
        animation: ping-badge 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #f8fafc;
      }
    </style>
  </defs>

  <!-- Frame Base -->
  <rect width="220" height="28" rx="6" fill="url(#cicd-bg)" stroke="#334155" stroke-width="1"/>

  <!-- Left: CI/CD Pipeline Label & Icon -->
  <g transform="translate(10, 6)">
    <!-- GitHub Actions Triangle Flow Icon -->
    <path d="M 4 8 L 8 4 L 12 8 L 8 12 Z" fill="#38bdf8" />
    <circle cx="8" cy="8" r="2" fill="#ffffff" />
    <text x="18" y="12" class="badge-label">CI/CD Pipeline</text>
  </g>

  <!-- Right: Status "Passing" with Animated Pulse Dot -->
  <g transform="translate(138, 14)">
    <circle cx="10" cy="0" r="3.5" fill="#4ade80" filter="url(#pill-glow)"/>
    <circle cx="10" cy="0" r="3.5" fill="#4ade80" class="badge-dot"/>
    <text x="22" y="4" class="badge-label" font-weight="700">passing</text>
  </g>
</svg>
